<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DISC 行為展現配對測驗</title>
  
  <!-- 引入 Tailwind CSS (負責畫面樣式) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel (用來在瀏覽器中解析 JSX 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      /* 防止在手機上拖曳時觸發重新整理或捲動 */
      overscroll-behavior-y: contain;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 圖示元件 ---
    const MoveIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="19 9 22 12 19 15"></polyline><polyline points="9 19 12 22 15 19"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
    );
    const PlayIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    );
    const RotateCcwIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    );
    const CheckIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
    );
    const XIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    );

    // --- 資料定義 ---
    const DISC_DATA = [
      { type: 'D', text: '立刻要結果，質問現狀' },
      { type: 'D', text: '採取行動，使用權威' },
      { type: 'D', text: '接受挑戰，克服困難' },
      { type: 'D', text: '很快做決定，解決問題' },
      { type: 'D', text: '重視個人的成就，不愛被管理監控' },
      { type: 'i', text: '喜歡接觸人，散發熱忱' },
      { type: 'i', text: '善於主動招待人，期望留給人好的印象' },
      { type: 'i', text: '口才流利，對人對事樂觀' },
      { type: 'i', text: '營造激勵人的環境，喜歡團隊活動' },
      { type: 'i', text: '期待受人歡迎及肯定' },
      { type: 'S', text: '對人有耐心，擅於傾聽' },
      { type: 'S', text: '願意幫助別人，建立和諧的工作環境' },
      { type: 'S', text: '可預期的安穩作業' },
      { type: 'S', text: '除非有好的改變理由，寧可維持現狀' },
      { type: 'S', text: '做事穩定可靠，表現配合度' },
      { type: 'C', text: '注重關鍵性的指令及標準' },
      { type: 'C', text: '能分析、評估利弊，評估分析工作績效' },
      { type: 'C', text: '按規執行系統化作業' },
      { type: 'C', text: '明確界定要求，注重影響因素' },
      { type: 'C', text: '注重品質及精確度' },
    ];

    // 顏色配置
    const CORNER_INFO = {
      D: { label: 'D 掌控型', position: '左上', color: 'bg-yellow-500', text: 'text-yellow-700', bgLight: 'bg-yellow-50', borderColor: 'border-yellow-500' },
      i: { label: 'i 影響型', position: '右上', color: 'bg-red-500', text: 'text-red-700', bgLight: 'bg-red-50', borderColor: 'border-red-500' },
      S: { label: 'S 沉穩型', position: '右下', color: 'bg-blue-500', text: 'text-blue-700', bgLight: 'bg-blue-50', borderColor: 'border-blue-500' },
      C: { label: 'C 嚴謹型', position: '左下', color: 'bg-green-500', text: 'text-green-700', bgLight: 'bg-green-50', borderColor: 'border-green-500' },
    };

    const shuffleArray = (array) => {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    };

    // --- 主元件 ---
    function App() {
      const [gameState, setGameState] = useState('start');
      const [cards, setCards] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState([]);

      const [isDragging, setIsDragging] = useState(false);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [startPos, setStartPos] = useState({ x: 0, y: 0 });
      const [activeCorner, setActiveCorner] = useState(null);
      const [cardExiting, setCardExiting] = useState(false);

      const cardRef = useRef(null);

      const startGame = () => {
        setCards(shuffleArray(DISC_DATA));
        setCurrentIndex(0);
        setAnswers([]);
        setCardExiting(false);
        setOffset({ x: 0, y: 0 });
        setActiveCorner(null);
        setGameState('playing');
      };

      const handlePointerDown = (e) => {
        if (cardExiting) return;
        setIsDragging(true);
        setStartPos({ x: e.clientX, y: e.clientY });
        e.target.setPointerCapture(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!isDragging || cardExiting) return;
        
        const currentX = e.clientX;
        const currentY = e.clientY;
        const dx = currentX - startPos.x;
        const dy = currentY - startPos.y;
        
        setOffset({ x: dx, y: dy });

        const threshold = 80; // 稍微降低判定距離，在小螢幕上更好操作
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > threshold) {
          if (dx < 0 && dy < 0) setActiveCorner('D');
          else if (dx > 0 && dy < 0) setActiveCorner('i');
          else if (dx > 0 && dy > 0) setActiveCorner('S');
          else if (dx < 0 && dy > 0) setActiveCorner('C');
        } else {
          setActiveCorner(null);
        }
      };

      const handlePointerUp = (e) => {
        if (!isDragging || cardExiting) return;
        setIsDragging(false);

        if (activeCorner) {
          setCardExiting(true);
          setOffset(prev => ({ x: prev.x * 5, y: prev.y * 5 }));

          setTimeout(() => {
            const currentCard = cards[currentIndex];
            const isCorrect = currentCard.type === activeCorner;
            
            setAnswers(prev => [...prev, {
              text: currentCard.text,
              correctType: currentCard.type,
              userType: activeCorner,
              isCorrect
            }]);

            if (currentIndex < cards.length - 1) {
              setCurrentIndex(prev => prev + 1);
              setOffset({ x: 0, y: 0 });
              setActiveCorner(null);
              setCardExiting(false);
            } else {
              setGameState('end');
            }
          }, 300);
        } else {
          setOffset({ x: 0, y: 0 });
        }
      };

      // 畫面：開始
      const renderStartScreen = () => (
        <div className="flex flex-col items-center justify-center min-h-screen p-6">
          <div className="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden p-8 text-center space-y-6 border border-slate-100">
            <div className="mx-auto w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4">
              <MoveIcon size={32} />
            </div>
            <h1 className="text-2xl font-bold text-slate-800">DISC 行為展現配對測驗</h1>
            
            <div className="text-left bg-slate-50 p-6 rounded-2xl text-slate-700 text-sm space-y-4">
              <p className="font-semibold text-center text-base mb-2">🕹️ 遊戲操作說明</p>
              <p>每次畫面上會出現一張寫有「行為展現」的卡片。請判斷該行為屬於哪一型，並將卡片<strong className="text-blue-600">拖曳</strong>至對應的角落：</p>
              <ul className="grid grid-cols-2 gap-3 mt-2 font-medium">
                <li className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-yellow-500"></span> 左上：D</li>
                <li className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-red-500"></span> 右上：i</li>
                <li className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-green-500"></span> 左下：C</li>
                <li className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-blue-500"></span> 右下：S</li>
              </ul>
              <p className="text-slate-500 mt-4 text-xs text-center border-t border-slate-200 pt-4">準備好接受挑戰了嗎？</p>
            </div>

            <button 
              onClick={startGame}
              className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-2 active:scale-95"
            >
              <PlayIcon size={20} /> 我瞭解了，開始測驗！
            </button>
          </div>
        </div>
      );

      // 畫面：遊戲中 (全面改為上下 Flex 排版，保證絕不重疊)
      const renderGameScreen = () => {
        const currentCard = cards[currentIndex];

        return (
          <div className="w-full h-screen overflow-hidden bg-slate-100 flex flex-col relative">
            
            {/* 背景色塊 (墊在最底層，負責發光提示) */}
            <div className={`absolute top-0 left-0 w-1/2 h-1/2 transition-colors duration-300 z-0 ${activeCorner === 'D' ? 'bg-yellow-50/50' : ''}`}></div>
            <div className={`absolute top-0 right-0 w-1/2 h-1/2 transition-colors duration-300 z-0 ${activeCorner === 'i' ? 'bg-red-50/50' : ''}`}></div>
            <div className={`absolute bottom-0 left-0 w-1/2 h-1/2 transition-colors duration-300 z-0 ${activeCorner === 'C' ? 'bg-green-50/50' : ''}`}></div>
            <div className={`absolute bottom-0 right-0 w-1/2 h-1/2 transition-colors duration-300 z-0 ${activeCorner === 'S' ? 'bg-blue-50/50' : ''}`}></div>

            {/* 頂部進度條 (獨立區塊，不重疊) */}
            <div className="w-full pt-6 pb-2 px-6 shrink-0 z-10 relative">
              <div className="w-full max-w-md mx-auto bg-slate-200 rounded-full h-2 overflow-hidden shadow-inner">
                <div 
                  className="h-full bg-slate-800 transition-all duration-300"
                  style={{ width: `${(currentIndex / cards.length) * 100}%` }}
                ></div>
              </div>
              <p className="text-center text-slate-500 text-sm font-medium mt-2">
                {currentIndex + 1} / {cards.length}
              </p>
            </div>

            {/* 主要遊戲區塊 (嚴格採用 Flex Column 垂直排列) */}
            <div className="flex-1 w-full flex flex-col justify-between p-4 sm:p-6 pb-8 z-10 relative">
              
              {/* 上排標籤：D 與 i (佔據自己的高度) */}
              <div className="flex justify-between items-start w-full pointer-events-none shrink-0">
                 <div className={`px-3 py-2 rounded-xl text-sm sm:text-base font-bold border-2 transition-all ${activeCorner === 'D' ? 'bg-yellow-500 text-white border-yellow-500 scale-110 shadow-lg shadow-yellow-200' : 'bg-white/90 border-slate-200 text-slate-500 shadow-sm'}`}>
                    ↖ D 掌控型
                 </div>
                 <div className={`px-3 py-2 rounded-xl text-sm sm:text-base font-bold border-2 transition-all ${activeCorner === 'i' ? 'bg-red-500 text-white border-red-500 scale-110 shadow-lg shadow-red-200' : 'bg-white/90 border-slate-200 text-slate-500 shadow-sm'}`}>
                    i 影響型 ↗
                 </div>
              </div>

              {/* 卡片本體 (自動置中於剩餘空間，不再擠壓標籤) */}
              <div className="flex-1 w-full flex items-center justify-center my-4" style={{ touchAction: 'none' }}>
                {currentCard && (
                  <div
                    ref={cardRef}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUp}
                    onPointerCancel={handlePointerUp}
                    // 加入 max-h 與 max-w 限制，避免卡片過大
                    className={`relative bg-white w-64 h-80 sm:w-72 sm:h-96 md:w-80 md:h-[26rem] max-h-[55vh] max-w-[80vw] rounded-3xl shadow-2xl flex items-center justify-center p-6 sm:p-8 text-center cursor-grab active:cursor-grabbing border-4 border-transparent z-20
                      ${!isDragging && !cardExiting ? 'transition-all duration-300 ease-out' : ''}
                      ${cardExiting ? 'transition-all duration-300 ease-in opacity-0' : ''}
                    `}
                    style={{
                      transform: `translate(${offset.x}px, ${offset.y}px) rotate(${offset.x * 0.05}deg)`,
                      borderColor: activeCorner ? (
                        activeCorner === 'D' ? '#eab308' :
                        activeCorner === 'i' ? '#ef4444' :
                        activeCorner === 'S' ? '#3b82f6' :
                        '#22c55e'
                      ) : 'transparent',
                      boxShadow: activeCorner ? `0 25px 50px -12px ${
                        activeCorner === 'D' ? 'rgba(234, 179, 8, 0.4)' :
                        activeCorner === 'i' ? 'rgba(239, 68, 68, 0.4)' :
                        activeCorner === 'S' ? 'rgba(59, 130, 246, 0.4)' :
                        'rgba(34, 197, 94, 0.4)'
                      }` : ''
                    }}
                  >
                    <h2 className="text-xl sm:text-2xl font-bold text-slate-700 pointer-events-none leading-snug sm:leading-relaxed">
                      {currentCard.text}
                    </h2>
                    <div className={`absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-200 ${activeCorner ? 'opacity-10' : 'opacity-0'}`}>
                      <span className="text-7xl sm:text-9xl font-black">{activeCorner}</span>
                    </div>
                  </div>
                )}
              </div>

              {/* 下排標籤：C 與 S (佔據自己的高度) */}
              <div className="flex justify-between items-end w-full pointer-events-none shrink-0">
                 <div className={`px-3 py-2 rounded-xl text-sm sm:text-base font-bold border-2 transition-all ${activeCorner === 'C' ? 'bg-green-500 text-white border-green-500 scale-110 shadow-lg shadow-green-200' : 'bg-white/90 border-slate-200 text-slate-500 shadow-sm'}`}>
                    ↙ C 嚴謹型
                 </div>
                 <div className={`px-3 py-2 rounded-xl text-sm sm:text-base font-bold border-2 transition-all ${activeCorner === 'S' ? 'bg-blue-500 text-white border-blue-500 scale-110 shadow-lg shadow-blue-200' : 'bg-white/90 border-slate-200 text-slate-500 shadow-sm'}`}>
                    S 沉穩型 ↘
                 </div>
              </div>

            </div>
          </div>
        );
      };

      // 畫面：結束與結算
      const renderEndScreen = () => {
        const correctCount = answers.filter(a => a.isCorrect).length;
        const scorePercentage = Math.round((correctCount / cards.length) * 100);

        return (
          <div className="min-h-screen py-12 px-4 flex flex-col items-center">
            <div className="max-w-2xl w-full bg-white rounded-3xl shadow-xl overflow-hidden">
              <div className="bg-slate-800 p-8 text-center text-white">
                <h1 className="text-3xl font-bold mb-2">測驗結果</h1>
                <p className="text-slate-300">你總共答對了 {correctCount} / {cards.length} 題</p>
                
                <div className="mt-6 inline-flex items-center justify-center w-32 h-32 rounded-full border-8 border-slate-700 bg-slate-800 relative">
                  <span className="text-4xl font-black">{scorePercentage}</span>
                  <span className="text-xl ml-1">%</span>
                </div>
              </div>

              <div className="p-6 md:p-8 space-y-4">
                <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2">詳細作答紀錄</h2>
                <div className="space-y-3">
                  {answers.map((ans, idx) => {
                    const isCorrect = ans.isCorrect;
                    return (
                      <div key={idx} className={`p-4 rounded-xl border flex flex-col md:flex-row gap-3 md:items-center justify-between ${isCorrect ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`}>
                        <div className="flex-1">
                          <div className="flex items-start gap-2">
                            {isCorrect ? <CheckIcon className="text-green-600 mt-1 shrink-0" size={18} /> : <XIcon className="text-red-500 mt-1 shrink-0" size={18} />}
                            <p className={`font-medium ${isCorrect ? 'text-green-900' : 'text-red-900'}`}>{ans.text}</p>
                          </div>
                        </div>
                        
                        <div className="flex gap-2 text-sm md:ml-8 mt-2 md:mt-0 pl-7 md:pl-0 shrink-0">
                          {!isCorrect && (
                            <span className="px-2 py-1 rounded bg-slate-200 text-slate-600 line-through opacity-70 flex items-center">
                              {CORNER_INFO[ans.userType].label}
                            </span>
                          )}
                          <span className={`px-3 py-1 rounded font-bold ${CORNER_INFO[ans.correctType].bgLight} ${CORNER_INFO[ans.correctType].text} border ${CORNER_INFO[ans.correctType].borderColor}`}>
                            {CORNER_INFO[ans.correctType].label}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="pt-8">
                  <button 
                    onClick={startGame}
                    className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 active:scale-95"
                  >
                    <RotateCcwIcon size={20} /> 重新測驗
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <React.Fragment>
          {gameState === 'start' && renderStartScreen()}
          {gameState === 'playing' && renderGameScreen()}
          {gameState === 'end' && renderEndScreen()}
        </React.Fragment>
      );
    }

    // 啟動 React 應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
